<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" role="img" aria-label="theAnalytico">
  <title>theAnalytico</title>
  <!-- "the" — lighter weight, optically smaller, sits on the cap line of A -->
  <text x="2" y="42" font-family="'Space Grotesk',sans-serif" font-size="22" font-weight="500"
        letter-spacing="-0.5" fill="currentColor" opacity="0.55">the</text>
  <!-- "Analytico" — the persistent part of the mark -->
  <text x="42" y="42" font-family="'Space Grotesk',sans-serif" font-size="34" font-weight="600"
        letter-spacing="-1.5" fill="currentColor">Analytico</text>
  <!-- Accent: the dot of the i becomes a data point -->
  <circle cx="205" cy="17" r="4.5" fill="#e5804b"/>
</svg>
