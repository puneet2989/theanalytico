<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assistant — mock</title>
<style>
  :root{
    --ink:#1a1a1a;
    --white:#ffffff;
    --paleblue:#e8f2fa;
    --cream:#f9f0ea;
    --grey:#f3f3f3;
    --terracotta:#e5804b;
    --periwinkle:#9999ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:1280px;height:800px;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--grey);
    color:var(--ink);
  }
  .stage{
    width:1280px;height:800px;
    display:flex;align-items:center;justify-content:center;
  }
  .panel{
    width:520px;height:660px;
    background:var(--white);
    border-radius:16px;
    box-shadow:0 4px 24px rgba(0,0,0,0.08);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .panel-header{
    padding:20px 24px;
    border-bottom:1px solid var(--grey);
    display:flex;align-items:center;gap:12px;
  }
  .avatar{
    width:36px;height:36px;border-radius:10px;
    background:var(--periwinkle);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:14px;
  }
  .header-name{font-size:14.5px;font-weight:600;}
  .header-sub{font-size:11.5px;color:#3d9a6a;display:flex;align-items:center;gap:6px;margin-top:2px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:#3d9a6a;}

  .messages{
    flex:1;padding:24px;display:flex;flex-direction:column;gap:14px;
    overflow:hidden;
  }
  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    font-size:14px;line-height:1.45;
    opacity:0;
    transform:translateY(8px);
  }
  .msg.customer{
    align-self:flex-start;
    background:var(--grey);
    border-bottom-left-radius:4px;
  }
  .msg.assistant{
    align-self:flex-end;
    background:var(--paleblue);
    border-bottom-right-radius:4px;
  }
  .typing{
    align-self:flex-end;
    background:var(--paleblue);
    border-radius:14px;border-bottom-right-radius:4px;
    padding:14px 18px;
    display:flex;gap:5px;
    opacity:0;
  }
  .typing .td{
    width:7px;height:7px;border-radius:50%;
    background:#9aa6c9;
  }
  .chip-row{align-self:flex-end;opacity:0;transform:translateX(16px);}
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--cream);
    border:1px solid #f0ddcf;
    color:#a2622f;
    font-size:12.5px;font-weight:600;
    padding:8px 14px;border-radius:100px;
  }
  .chip .tick{
    width:15px;height:15px;border-radius:50%;
    background:var(--terracotta);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;
  }
  .cursor{
    display:inline-block;width:2px;height:14px;background:var(--ink);
    margin-left:2px;vertical-align:middle;
    animation:blink 0.8s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .panel-footer{
    padding:16px 24px;border-top:1px solid var(--grey);
    display:flex;align-items:center;gap:10px;
  }
  .input-fake{
    flex:1;background:var(--grey);border-radius:100px;
    height:38px;
  }
  .send-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--terracotta);
    flex-shrink:0;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="panel">
    <div class="panel-header">
      <div class="avatar">A</div>
      <div>
        <div class="header-name">Assistant</div>
        <div class="header-sub"><span class="status-dot"></span>Online</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="msg customer" id="msgCustomer">Hi, do you have any appointments free this Thursday afternoon?</div>
      <div class="typing" id="typingDots">
        <div class="td"></div><div class="td"></div><div class="td"></div>
      </div>
      <div class="msg assistant" id="msgAssistant"><span id="assistantText"></span><span class="cursor" id="cursor"></span></div>
      <div class="chip-row" id="chipRow"><div class="chip"><span class="tick">✓</span>Booking confirmed</div></div>
    </div>

    <div class="panel-footer">
      <div class="input-fake"></div>
      <div class="send-btn"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var LOOP = 4000;
  var start = null;

  var fullReply = "Yes — 2.30pm or 4pm both open. Shall I book 2.30pm for you?";
  var customerEl = document.getElementById('msgCustomer');
  var typingEl = document.getElementById('typingDots');
  var assistantMsgEl = document.getElementById('msgAssistant');
  var assistantTextEl = document.getElementById('assistantText');
  var cursorEl = document.getElementById('cursor');
  var chipRowEl = document.getElementById('chipRow');
  var dots = typingEl.querySelectorAll('.td');

  // timeline (ms within loop)
  var T_CUSTOMER_IN = 100;
  var T_TYPING_IN = 500;
  var T_TYPING_OUT = 1300;
  var T_REPLY_START = 1350;
  var T_REPLY_END = 3050; // typing duration for reply chars
  var T_CHIP_IN = 3250;
  var T_HOLD_END = 3950;

  var lastTypedLen = -1;

  function setOpacity(el, v){ el.style.opacity = v; }

  function frame(ts){
    if(start===null) start = ts;
    var elapsed = (ts - start) % LOOP;

    // customer message fade/slide in
    if(elapsed >= T_CUSTOMER_IN){
      var p = Math.min(1, (elapsed - T_CUSTOMER_IN)/250);
      customerEl.style.opacity = p;
      customerEl.style.transform = 'translateY(' + (8*(1-p)) + 'px)';
    } else {
      customerEl.style.opacity = 0;
      customerEl.style.transform = 'translateY(8px)';
    }

    // typing indicator visible window
    if(elapsed >= T_TYPING_IN && elapsed < T_TYPING_OUT){
      typingEl.style.opacity = 1;
      var tt = (elapsed - T_TYPING_IN)/700;
      dots.forEach(function(d, i){
        var phase = (tt*2 + i*0.33) % 1;
        var s = phase < 0.5 ? 1 - phase*0.7 : 0.65 + (phase-0.5)*0.7;
        d.style.transform = 'scale(' + (0.85 + 0.3*Math.sin(phase*Math.PI*2)) + ')';
        d.style.opacity = 0.4 + 0.6*Math.abs(Math.sin(phase*Math.PI));
      });
    } else {
      typingEl.style.opacity = 0;
    }

    // assistant reply typing
    if(elapsed >= T_REPLY_START){
      assistantMsgEl.style.opacity = 1;
      var span = Math.max(1, T_REPLY_END - T_REPLY_START);
      var frac = Math.min(1, (elapsed - T_REPLY_START)/span);
      var len = Math.floor(frac * fullReply.length);
      if(len !== lastTypedLen){
        assistantTextEl.textContent = fullReply.slice(0, len);
        lastTypedLen = len;
      }
      cursorEl.style.display = frac < 1 ? 'inline-block' : 'none';
    } else {
      assistantMsgEl.style.opacity = 0;
      lastTypedLen = -1;
    }

    // booking confirmed chip
    if(elapsed >= T_CHIP_IN){
      var cp = Math.min(1, (elapsed - T_CHIP_IN)/300);
      chipRowEl.style.opacity = cp;
      chipRowEl.style.transform = 'translateX(' + (16*(1-cp)) + 'px)';
    } else {
      chipRowEl.style.opacity = 0;
      chipRowEl.style.transform = 'translateX(16px)';
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
